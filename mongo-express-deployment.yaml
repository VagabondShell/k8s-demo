apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app: express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express-container
        image: mongo-express:latest
        ports:
          - containerPort: 8081
        env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
            - name: ME_CONFIG_MONGODB_SERVER
              valueFrom:
                configMapKeyRef:
                  name: mongodb-configmap
                  key: database_url
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
spec:
  type: NodePort
  ports:
    - port: 8081        # Port inside the cluster
      targetPort: 8081  # Port the Mongo Express container listens on
      nodePort: 30081   # The exact port you mapped in k3d!
  selector:
    app: mongo-express
